# Admin app — /var/www/viso/admin/dist
# server_name: admin.visogroup.com ONLY (do not add visogroup.com here)
# Requires: /etc/nginx/conf.d/viso-upstream.conf

server {
    listen 80;
    listen [::]:80;
    server_name admin.visogroup.com;

    root /var/www/viso/admin/dist;
    index index.html;

    location /.well-known/acme-challenge/ {
        root /var/www/viso/admin/dist;
        allow all;
    }

    location = / {
        return 301 /admin;
    }

    location /api/ {
        proxy_pass http://viso_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|json|xml|txt)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Admin should not be indexed
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
}
